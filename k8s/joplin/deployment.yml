apiVersion: apps/v1
kind: Deployment
metadata:
  name: joplin
  labels:
    app: joplin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: joplin
  template:
    metadata:
      labels:
        app: joplin
    spec:
      volumes:
        - name: joplin-db-data
          persistentVolumeClaim:
            claimName: pvc-joplin-db-data
      containers:
      - name: joplin-db
        image: postgres:16
        volumeMounts:
          - mountPath: "/var/lib/postgresql/data"
            name: joplin-db-data
        env:
          - name: POSTGRES_PASSWORD
            value: "changeme"
          - name: POSTGRES_PORT
            value: "5432"
          - name: POSTGRES_USER
            value: "joplin"
          - name: POSTGRES_DATABASE
            value: "joplin-data"
          - name: PGDATA
            value: "/var/lib/postgresql/data/pgdata"
      - name: joplin-app
        image: joplin/server:latest
        ports:
        - containerPort: 22300
          hostPort: 22300
        env:
          - name: APP_BASE_URL
            value: "https://joplin.eu1.netbird.services"
          - name: APP_PORT
            value: "22300"
          - name: POSTGRES_PASSWORD
            value: "changeme"
          - name: POSTGRES_PORT
            value: "5432"
          - name: POSTGRES_USER
            value: "joplin"
          - name: POSTGRES_DATABASE
            value: "joplin-data"
          - name: POSTGRES_HOST
            value: "localhost"
